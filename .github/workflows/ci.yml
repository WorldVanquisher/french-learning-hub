name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Check whitespace errors
        run: git diff --check

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build server
        run: go build ./cmd/server

      - name: Build capture CLI
        run: go build ./cmd/capture

      - name: Build semantic-index CLI
        run: go build -o "$RUNNER_TEMP/semantic-index" ./cmd/semantic-index

  # Real-Qdrant regression (FLH-046). The `ci` job runs `go test ./...` without
  # FLH_QDRANT_URL, so the real-Qdrant integration tests skip there. This job
  # starts the Qdrant image pinned by digest in compose.yaml (tmpfs storage,
  # loopback port) and fails unless every expected integration test ran and
  # passed. Embeddings are deterministic fakes: no external service or secret.
  qdrant-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Helper self-tests
        timeout-minutes: 2
        run: python3 -B -m unittest discover -s scripts/ci/flh046 -p 'test_*.py'

      - name: Real Qdrant integration suite
        timeout-minutes: 22
        run: >-
          python3 -B scripts/ci/flh046/qdrant_regression.py
          --artifacts "$RUNNER_TEMP/flh046"
          --pull-timeout 300 --ready-timeout 90 --test-timeout 600

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qdrant-regression
          path: ${{ runner.temp }}/flh046
          if-no-files-found: warn
          retention-days: 14

      # Safety net if the helper itself was killed before its own cleanup.
      - name: Remove leftover task containers
        if: always()
        run: |
          ids="$(docker ps -aq --filter label=org.flh.task=flh046)"
          if [ -n "$ids" ]; then docker rm -f -v $ids; fi

  # Frontend checks for the human concept-review UI (milestone 10.6). This job does
  # NOT depend on any external service (no running backend, no OpenAI API): it only
  # typechecks, builds, and unit-tests the web app against mocked fetch.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

  # Standard-library Python tool suites: release helpers, private staging,
  # extraction and workbooks, through scripts/ci/python_suites.py, the same
  # entry point as a local run (docs/RELEASE.md, "Python tool suites"). No
  # service, secret, AWS account or third-party package is used. The Speaking
  # and training-backend suites need numpy/PyAV/torch and are not part of
  # this job. Each suite is labelled in the log; every suite runs, and any
  # failure fails the job. The summary table goes to the job summary.
  python-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # --hermetic: no AWS settings, an empty HOME, and aws/terraform/docker trapped (any call fails).
      # Speaking's offline suite runs once tools/speaking/scripts/run_tests.py exists (NOT-PRESENT before).
      - name: Python tool suites (ci-runner, release, private-staging, extraction, workbooks, speaking if present)
        run: |
          python3 --version
          python3 -B scripts/ci/python_suites.py --hermetic --summary "$GITHUB_STEP_SUMMARY" --json "$RUNNER_TEMP/python-suites.json"

      # Runs after a failure too; the job keeps the failing status of the step above.
      - name: Upload the suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-suites
          path: ${{ runner.temp }}/python-suites.json
          if-no-files-found: warn
          retention-days: 14
