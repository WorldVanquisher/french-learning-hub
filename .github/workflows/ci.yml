name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Check whitespace errors
        run: git diff --check

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build server
        run: go build ./cmd/server

      - name: Build capture CLI
        run: go build ./cmd/capture

  # Frontend checks for the human concept-review UI (milestone 10.6). This job does
  # NOT depend on any external service (no running backend, no OpenAI API): it only
  # typechecks, builds, and unit-tests the web app against mocked fetch.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test
